<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>KidsPlay - Chơi Hay Thông Minh</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=Nunito:wght@800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
  <style>
    body {
      font-family: 'Nunito', sans-serif;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .font-title { font-family: 'Comfortaa', cursive; }
    .bubble { animation: float 3s infinite ease-in-out; }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes pop {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.3); opacity: 0.8; }
      100% { transform: scale(0); opacity: 0; }
    }
    .popping { animation: pop 0.2s forwards ease-out; }
  </style>

  <!-- AUTO REDIRECT NẾU DÙNG LINK ?go=shopee -->
  <script>
    const AFFILIATE_LINKS = [
      "https://s.shopee.vn/7Kxk1tp4c7",
      "https://s.shopee.vn/3qNrrXM5pI",
      "https://s.shopee.vn/8V9hQAP2sE"
    ];
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('go') === 'shopee') {
      const randomLink = AFFILIATE_LINKS[Math.floor(Math.random() * AFFILIATE_LINKS.length)];
      window.location.href = randomLink;
    }
  </script>
</head>
<body class="bg-sky-100 min-h-screen flex flex-col justify-between items-center p-2 sm:p-4 pb-20">

  <!-- HEADER -->
  <header class="w-full max-w-md bg-white rounded-3xl p-3 shadow-lg border-4 border-yellow-300 flex justify-between items-center mb-2">
    <div class="flex items-center gap-2">
      <span class="text-3xl">🎈</span>
      <div>
        <h1 class="text-xl font-black text-amber-500 font-title tracking-wide">KIDS PLAY</h1>
        <p class="text-xs font-bold text-gray-400">Chơi hay - Thông minh giỏi</p>
      </div>
    </div>
    <div class="bg-amber-100 text-amber-700 font-black px-3 py-1.5 rounded-2xl text-sm border-2 border-amber-300 flex items-center gap-1">
      ⭐ <span id="score">0</span>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="w-full max-w-md flex-1 flex flex-col justify-center">

    <!-- GAME 1: TÌM 5 ĐIỂM KHÁC BIỆT -->
    <section id="game1" class="game-screen bg-white rounded-3xl p-4 shadow-xl border-4 border-cyan-400 text-center flex flex-col items-center">
      <h2 class="text-lg font-black text-cyan-600 mb-1 font-title">🔎 TÌM 5 ĐIỂM KHÁC NHAU</h2>
      <p class="text-xs font-bold text-gray-500 mb-2">Chạm vào 5 điểm khác biệt ở Tấm Hình Bên Dưới nhé!</p>
      
      <div class="w-full space-y-2 relative">
        <!-- HÌNH TRÊN (GỐC) -->
        <div class="relative rounded-2xl overflow-hidden border-2 border-cyan-200 shadow-sm bg-sky-200">
          <svg viewBox="0 0 300 150" class="w-full h-auto">
            <rect x="0" y="0" width="300" height="100" fill="#bae6fd"/>
            <circle cx="260" cy="30" r="18" fill="#fde047"/>
            <path d="M 0 100 Q 150 70 300 100 L 300 150 L 0 150 Z" fill="#4ade80"/>
            <!-- Cây -->
            <rect x="30" y="60" width="16" height="40" fill="#854d0e"/>
            <circle cx="38" cy="55" r="22" fill="#16a34a"/>
            <!-- Mèo -->
            <circle cx="120" cy="105" r="16" fill="#fb923c"/>
            <circle cx="120" cy="93" r="11" fill="#fb923c"/>
            <!-- Cún -->
            <circle cx="180" cy="108" r="16" fill="#a16207"/>
            <circle cx="180" cy="96" r="11" fill="#a16207"/>
            <!-- Hoa & Táo -->
            <circle cx="70" cy="120" r="5" fill="#f43f5e"/>
            <circle cx="32" cy="48" r="4" fill="#dc2626"/>
            <circle cx="45" cy="58" r="4" fill="#dc2626"/>
          </svg>
        </div>

        <!-- HÌNH DƯỚI (CÓ 5 ĐIỂM BẤM TƯƠNG TÁC CHUẨN) -->
        <div class="relative rounded-2xl overflow-hidden border-2 border-cyan-400 shadow-md bg-sky-200">
          <svg viewBox="0 0 300 150" class="w-full h-auto">
            <rect x="0" y="0" width="300" height="100" fill="#bae6fd"/>
            <circle cx="260" cy="30" r="18" fill="#fde047"/>
            <path d="M 0 100 Q 150 70 300 100 L 300 150 L 0 150 Z" fill="#4ade80"/>
            <rect x="30" y="60" width="16" height="40" fill="#854d0e"/>
            <circle cx="38" cy="55" r="22" fill="#16a34a"/>
            <!-- Mèo -->
            <circle cx="120" cy="105" r="16" fill="#fb923c"/>
            <circle cx="120" cy="93" r="11" fill="#fb923c"/>
            <!-- Cún -->
            <circle cx="180" cy="108" r="16" fill="#a16207"/>
            <circle cx="180" cy="96" r="11" fill="#a16207"/>
            <circle cx="70" cy="120" r="5" fill="#f43f5e"/>
            <circle cx="32" cy="48" r="4" fill="#dc2626"/>
            <circle cx="45" cy="58" r="4" fill="#dc2626"/>

            <!-- 5 VÙNG BẤM TƯƠNG TÁC (CÓ HÌNH KHÁC BIỆT RÕ RÀNG) -->
            <!-- 1. Mây xuất hiện góc trên trái -->
            <g onclick="foundDiff(this, 1)" class="cursor-pointer">
              <rect x="70" y="15" width="50" height="35" fill="transparent"/>
              <path d="M 80 30 Q 85 20 95 25 Q 105 20 110 30 Z" fill="#ffffff"/>
            </g>

            <!-- 2. Nơ hồng trên đầu mèo -->
            <g onclick="foundDiff(this, 2)" class="cursor-pointer">
              <rect x="105" y="75" width="30" height="30" fill="transparent"/>
              <circle cx="120" cy="83" r="5" fill="#ec4899"/>
            </g>

            <!-- 3. Bóng bay cạnh Cún -->
            <g onclick="foundDiff(this, 3)" class="cursor-pointer">
              <rect x="200" y="70" width="35" height="45" fill="transparent"/>
              <circle cx="215" cy="85" r="9" fill="#3b82f6"/>
              <line x1="215" y1="94" x2="215" y2="110" stroke="#64748b" stroke-width="1.5"/>
            </g>

            <!-- 4. Bông hoa màu tím -->
            <g onclick="foundDiff(this, 4)" class="cursor-pointer">
              <rect x="230" y="105" width="30" height="30" fill="transparent"/>
              <circle cx="245" cy="120" r="6" fill="#a855f7"/>
            </g>

            <!-- 5. Quả tím trên cây -->
            <g onclick="foundDiff(this, 5)" class="cursor-pointer">
              <rect x="15" y="55" width="30" height="30" fill="transparent"/>
              <circle cx="25" cy="65" r="5" fill="#a855f7"/>
            </g>
          </svg>
        </div>
      </div>

      <div class="mt-2 flex gap-2 font-black text-sm text-cyan-700">
        Đã tìm: <span id="diff-count" class="text-rose-500 text-base">0</span>/5
      </div>
