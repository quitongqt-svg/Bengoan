<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>KidsPlay - Siêu Game Cho Bé</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=Nunito:wght@800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
  <style>
    body {
      font-family: 'Nunito', sans-serif;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .font-title { font-family: 'Comfortaa', cursive; }
    .bubble { animation: float 3s infinite ease-in-out; }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes pop {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.3); opacity: 0.8; }
      100% { transform: scale(0); opacity: 0; }
    }
    .popping { animation: pop 0.2s forwards ease-out; }
  </style>

  <!-- AUTO REDIRECT NẾU DÙNG LINK ?go=shopee -->
  <script>
    const AFFILIATE_LINKS = [
      "https://s.shopee.vn/7Kxk1tp4c7",
      "https://s.shopee.vn/3qNrrXM5pI",
      "https://s.shopee.vn/8V9hQAP2sE"
    ];
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('go') === 'shopee') {
      const randomLink = AFFILIATE_LINKS[Math.floor(Math.random() * AFFILIATE_LINKS.length)];
      window.location.href = randomLink;
    }
  </script>
</head>
<body class="bg-sky-100 min-h-screen flex flex-col justify-between items-center p-2 sm:p-4 pb-20">

  <!-- HEADER -->
  <header class="w-full max-w-md bg-white rounded-3xl p-3 shadow-lg border-4 border-yellow-300 flex justify-between items-center mb-2">
    <div class="flex items-center gap-2">
      <span class="text-3xl">🎈</span>
      <div>
        <h1 class="text-xl font-black text-amber-500 font-title tracking-wide">KIDS PLAY</h1>
        <p class="text-xs font-bold text-gray-400">Chơi hay - Thông minh giỏi</p>
      </div>
    </div>
    <div class="bg-amber-100 text-amber-700 font-black px-3 py-1.5 rounded-2xl text-sm border-2 border-amber-300 flex items-center gap-1">
      ⭐ <span id="score">0</span>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="w-full max-w-md flex-1 flex flex-col justify-center">

    <!-- GAME 1: TÌM 5 ĐIỂM KHÁC BIỆT -->
    <section id="game1" class="game-screen bg-white rounded-3xl p-4 shadow-xl border-4 border-cyan-400 text-center flex flex-col items-center">
      <h2 class="text-lg font-black text-cyan-600 mb-1 font-title">🔎 TÌM 5 ĐIỂM KHÁC NHAU</h2>
      <p class="text-xs font-bold text-gray-500 mb-2">Chạm vào 5 điểm khác biệt ở Tấm Hình Bên Dưới nhé!</p>
      
      <div class="w-full space-y-2 relative">
        <!-- Hình 1 (Gốc) -->
        <div class="relative rounded-2xl overflow-hidden border-2 border-cyan-200 shadow-sm">
          <img src="https://img.freepik.com/free-vector/park-scene-with-cute-animals_1308-47932.jpg" class="w-full h-36 object-cover" alt="Hình gốc">
        </div>

        <!-- Hình 2 (Hình tương tác) -->
        <div class="relative rounded-2xl overflow-hidden border-2 border-cyan-400 shadow-md">
          <img src="https://img.freepik.com/free-vector/park-scene-with-cute-animals_1308-47932.jpg" class="w-full h-36 object-cover" alt="Hình so sánh">
          
          <!-- Layer chứa 5 điểm ẩn để bé chạm -->
          <div class="absolute inset-0">
            <!-- Điểm 1: Mặt trời / Góc trên trái -->
            <button onclick="foundDiff(this, 1)" class="absolute top-2 left-4 w-8 h-8 rounded-full focus:outline-none"></button>
            <!-- Điểm 2: Bụi cây / Giữa trái -->
            <button onclick="foundDiff(this, 2)" class="absolute top-12 left-20 w-8 h-8 rounded-full focus:outline-none"></button>
            <!-- Điểm 3: Con vật ở giữa -->
            <button onclick="foundDiff(this, 3)" class="absolute bottom-4 left-1/2 -translate-x-1/2 w-10 h-10 rounded-full focus:outline-none"></button>
            <!-- Điểm 4: Tán cây phải -->
            <button onclick="foundDiff(this, 4)" class="absolute top-3 right-6 w-8 h-8 rounded-full focus:outline-none"></button>
            <!-- Điểm 5: Cánh hoa dưới phải -->
            <button onclick="foundDiff(this, 5)" class="absolute bottom-3 right-4 w-8 h-8 rounded-full focus:outline-none"></button>
          </div>
        </div>
      </div>

      <div class="mt-2 flex gap-2 font-black text-sm text-cyan-700">
        Đã tìm: <span id="diff-count" class="text-rose-500 text-base">0</span>/5
      </div>

      <!-- NÚT THƯỞNG GAME 1 -->
      <a href="https://s.shopee.vn/3qNrrXM5pI" target="_blank" class="w-full mt-3 bg-gradient-to-r from-cyan-500 to-blue-500 hover:from-cyan-600 hover:to-blue-600 text-white font-black text-sm py-3 px-3 rounded-2xl shadow-md border-2 border-white flex items-center justify-center gap-2 transform active:scale-95 transition animate-bounce">
        🎨 THƯỞNG BÉ: BẢNG VẼ TỰ XÓA <span class="text-[10px] bg-yellow-300 text-gray-900 px-2 py-0.5 rounded-full uppercase font-extrabold">Shopee</span>
      </a>
    </section>

    <!-- GAME 2: NỐI HÌNH CON VẬT -->
    <section id="game2" class="game-screen hidden bg-white rounded-3xl p-4 shadow-xl border-4 border-purple-400 text-center flex flex-col items-center">
      <h2 class="text-lg font-black text-purple-600 mb-1 font-title">🐱 NỐI HÌNH CON VẬT</h2>
      <p class="text-xs font-bold text-gray-500 mb-3">Con
